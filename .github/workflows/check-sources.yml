name: Verifica fonti

# Diagnostica: dice quali fonti rispondono davvero e con quanti articoli.
# Da lanciare a mano ogni volta che si aggiunge o si sospetta una fonte
# (Actions -> Verifica fonti -> Run workflow). Gira anche una volta a settimana
# per accorgersi in anticipo di una fonte che sta morendo lentamente.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL candidati da sondare, separati da spazio (vuoto = controlla le fonti configurate)"
        required: false
        default: ""

  schedule:
    - cron: '23 6 * * 1'   # lunedì mattina

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Interroga le fonti
        run: |
          if [ -n "${{ inputs.urls }}" ]; then
            python3 scripts/check_sources.py --probe ${{ inputs.urls }} | tee /tmp/report.txt
          else
            python3 scripts/check_sources.py | tee /tmp/report.txt
          fi

      - name: Salva l'esito nel repository
        run: |
          git config user.name  "molecola-bot"
          git config user.email "actions@users.noreply.github.com"
          # I log di Actions vivono su uno storage che non tutti gli ambienti
          # raggiungono: l'esito della sonda si legge nel repository.
          if [ -n "${{ inputs.urls }}" ]; then
            cp /tmp/report.txt data/probe-results.txt
            git add data/probe-results.txt
            git diff --cached --quiet || git commit -m "Esito della sonda sugli URL candidati"
            git pull --rebase origin main && git push origin HEAD:main
            exit 0
          fi
          # git diff non vede un file non ancora tracciato: si mette in stage
          # e poi si controlla l'indice, altrimenti il primo referto non viene
          # mai committato.
          git add data/source-health.json
          if git diff --cached --quiet; then echo "referto invariato"; exit 0; fi
          git commit -m "Referto fonti"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Riepilogo leggibile
        if: always()
        run: |
          {
            echo "### Stato delle fonti"
            echo ""
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
